<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171925">
<title>Rota Nova Penedo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><img src="img/logo.png" alt="Nova Penedo Distribuidora"><small>Rota do promotor</small></div>
  <div class="row" style="gap:6px"><div class="who" id="quem"></div><button class="btn ghost sm" id="sair" hidden>Sair</button></div>
</div></header>

<main id="main">
  <div id="carregando" class="empty">Carregando…</div>

  <!-- LOGIN -->
  <section id="v-login" class="login" hidden>
    <div class="logo"><img src="img/logo-full.png" alt="Nova Penedo Distribuidora"></div>
    <h2>Entrar</h2>
    <form id="f-login" class="stack" autocomplete="on">
      <label class="field" for="lg-usuario"><span>Seu usuário (primeiro nome)</span><input type="text" id="lg-usuario" autocapitalize="none" autocomplete="username" placeholder="ex.: mariana"></label>
      <div class="field"><span>Código de 4 números</span>
        <div class="pin"><input id="pin-0" inputmode="numeric" maxlength="1" aria-label="Dígito 1"><input id="pin-1" inputmode="numeric" maxlength="1" aria-label="Dígito 2"><input id="pin-2" inputmode="numeric" maxlength="1" aria-label="Dígito 3"><input id="pin-3" inputmode="numeric" maxlength="1" aria-label="Dígito 4"></div>
      </div>
      <span id="lg-msg" class="muted" style="min-height:18px;font-size:13px"></span>
      <button class="btn primary big" type="submit" id="lg-btn">Entrar</button>
    </form>
    <p class="muted" style="font-size:13px;text-align:center">Esqueceu o código? Fale com o supervisor.<br><a href="gestao.html" class="btn ghost">Acesso da gestão</a></p>
  </section>

  <section id="v-semacesso" class="empty" hidden><b>Acesso ainda não liberado</b>Seu login existe, mas não está ligado a nenhum promotor. Fale com o supervisor.</section>

  <!-- ROTA -->
  <section id="v-rota" class="stack" hidden></section>
</main>

<!-- VISITA -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="spread"><button class="btn ghost" id="v-voltar" style="padding-left:0">‹ Voltar para a rota</button><span id="v-pill"></span></div>
    <div><div class="label" id="v-ordem"></div><h2 id="v-nome" style="font-size:26px"></h2><div class="muted" id="v-end"></div></div>
    <div id="v-status" class="stack"></div>
    <div id="v-detalhes" class="stack" hidden>
      <div class="card stack"><div class="spread"><h3>Fotos da visita</h3><span class="muted num" id="v-fotos-n"></span></div><div class="fotos" id="v-fotos"></div></div>
      <div class="card stack"><h3>Checklist</h3><div id="v-check"></div></div>
      <div class="card stack">
        <label class="field" for="v-obs"><span>Observações</span><textarea id="v-obs" placeholder="Ex.: gerente pediu reposição na quinta"></textarea></label>
        <span class="muted" id="v-obs-st" style="font-size:12px"></span>
      </div>
      <div id="v-saida"></div>
    </div>
  </div>
</div>

<script type="module" src="js/promotor.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
