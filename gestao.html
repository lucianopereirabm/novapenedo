<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171925">
<title>Gestão Rota Nova Penedo</title>
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
</head>
<body class="gestao">
<header class="top"><div class="top-in">
  <div class="brand"><img src="img/logo.png" alt="Nova Penedo Distribuidora"><small>Gestão de rotas</small></div>
  <div class="row" style="gap:6px"><div class="who" id="quem"></div><button class="btn ghost sm" id="sair" hidden>Sair</button></div>
</div></header>

<section id="v-login" class="login" hidden style="padding:0 16px">
  <h2>Entrar na Gestão</h2>
  <form id="f-login" class="stack">
    <label class="field" for="lg-email"><span>E-mail</span><input type="email" id="lg-email" autocomplete="username"></label>
    <label class="field" for="lg-senha"><span>Senha</span><input type="password" id="lg-senha" autocomplete="current-password"></label>
    <span id="lg-msg" class="muted" style="min-height:18px;font-size:13px"></span>
    <button class="btn primary big" type="submit">Entrar</button>
  </form>
  <a href="index.html" class="btn ghost">Sou promotor</a>
</section>
<section id="v-negado" class="empty" hidden style="margin:24px 16px"><b>Este login não é da gestão</b>Entre com o e-mail de administrador.</section>

<div class="shell" id="shell" hidden>
<nav class="side" aria-label="Gestão">
  <button class="side-item" data-go="painel"><span class="ic">●</span>Monitoramento</button>
  <button class="side-item" data-go="montar"><span class="ic">↕</span>Montar rotas</button>
  <button class="side-item" data-go="cli"><span class="ic">#</span>Clientes</button>
  <button class="side-item" data-go="var"><span class="ic">$</span>Variável promotor</button>
  <button class="side-item" data-go="equipe"><span class="ic">☺</span>Equipe e acessos</button>
  <button class="side-item" data-go="config"><span class="ic">⚙</span>Configurações</button>
  <div class="muted" id="versao-g" style="font-size:11px;padding:12px 10px 0;margin-top:auto"></div>
</nav>
<main id="main">
  <section id="v-painel" class="stack" hidden></section>
  <section id="v-montar" class="stack" hidden></section>
  <section id="v-cli" class="stack" hidden></section>
  <section id="v-var" class="stack" hidden></section>
  <section id="v-equipe" class="stack" hidden></section>
  <section id="v-config" class="stack" hidden></section>
</main>
</div>
<script type="module" src="js/gestao.js"></script>
<script>
// mantém a Gestão sempre na versão mais nova (troca e recarrega sozinha uma vez quando sai atualização)
if ('serviceWorker' in navigator) {
  let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recarregou) { recarregou = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
}
</script>
</body>
</html>
